spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
        - id: employee-application
          uri: lb://employee-application
          predicates:
          - Path=/employee/**
        - id: company-application
          uri: lb://company-application
          predicates:
          - Path=/company/**
server:
  port: 8899

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost


      
